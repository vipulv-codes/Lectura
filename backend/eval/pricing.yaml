# Per-million-token prices used for cost-per-query estimates.
# Source: https://ai.google.dev/gemini-api/docs/pricing (page last updated
# 2026-09-04, fetched 2026-09-08). Paid tier, text input, prompts <= 200k
# tokens. Thinking tokens are billed as output on 2.5 models. Re-check the page
# and bump `as_of` before quoting costs.
as_of: "2026-09-08"
currency: USD
models:
  gemini-2.5-flash:
    input_per_m: 0.30
    output_per_m: 2.50
    cached_input_per_m: 0.03
    verified: true
  gemini-2.5-pro:
    input_per_m: 1.25
    output_per_m: 10.00
    cached_input_per_m: 0.125
    verified: true
  gemini-2.5-flash-lite:
    input_per_m: 0.10
    output_per_m: 0.40
    cached_input_per_m: 0.01
    verified: true
  # gemini-2.5-pro is listed by models.list() but returns 404 for API keys
  # created after it was closed to new users; 3.1-pro-preview is its
  # replacement. Prices for prompts <= 200k tokens.
  gemini-3.1-pro-preview:
    input_per_m: 2.00
    output_per_m: 12.00
    verified: true
  gemini-3-flash-preview:
    input_per_m: 0.50
    output_per_m: 3.00
    verified: true
  gemini-3.5-flash:
    input_per_m: 1.50
    output_per_m: 9.00
    verified: true
